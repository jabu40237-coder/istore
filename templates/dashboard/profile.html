{% extends "dashboard/base_dash.html" %}
{% block dash %}
<div class="card" style="max-width:520px;">
  <h2 style="margin-bottom:1.2rem;">{{ t('profile') }}</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ session.get('csrf','') }}">
    <div class="field"><label class="lbl">{{ t('name') }}</label>
      <input class="input" name="name" value="{{ u.name }}"></div>
    <div class="field"><label class="lbl">{{ t('email') }}</label>
      <input class="input" value="{{ u.email }}" disabled dir="ltr"></div>
    <div class="field"><label class="lbl">{{ t('phone') }}</label>
      <input class="input" name="phone" value="{{ u.phone }}" dir="ltr"></div>
    <div class="field"><label class="lbl">{{ t('language') }}</label>
      <select class="select" name="language">
        <option value="ku" {% if u.language=='ku' %}selected{% endif %}>Kurdî (Badînî)</option>
        <option value="ar" {% if u.language=='ar' %}selected{% endif %}>العربية</option>
        <option value="en" {% if u.language=='en' %}selected{% endif %}>English</option>
      </select></div>
    <div class="field"><label class="lbl">{{ t('currency') }}</label>
      <select class="select" name="currency">
        <option value="USD" {% if u.currency=='USD' %}selected{% endif %}>USD ($)</option>
        <option value="IQD" {% if u.currency=='IQD' %}selected{% endif %}>IQD (د.ع)</option>
      </select></div>
    <button class="btn btn-primary" type="submit">{{ t('save') }}</button>
  </form>
</div>
<div class="card" style="max-width:520px; margin-top:1.2rem;">
  <h3 style="margin-bottom:.8rem;">Telegram</h3>
  {% if u.telegram_id %}
  <p class="ok-dot">● {{ t('tg_linked') }}</p>
  <form method="post" action="{{ url_for('user.telegram_unlink') }}" style="margin-top:.6rem;">
    <input type="hidden" name="csrf" value="{{ session.get('csrf','') }}">
    <button class="btn btn-ghost btn-sm" type="submit">{{ t('tg_unlink') }}</button>
  </form>
  {% else %}
  <p style="color:var(--text-muted); font-size:.9rem; margin-bottom:.8rem;">{{ t('tg_link_hint') }}</p>
  <form method="post" action="{{ url_for('user.telegram_code') }}">
    <input type="hidden" name="csrf" value="{{ session.get('csrf','') }}">
    <button class="btn btn-ghost btn-sm" type="submit">{{ t('tg_get_code') }}</button>
  </form>
  {% if tg_code %}
  <div class="total-box" style="margin-top:.8rem;">
    <span>{{ t('tg_your_code') }}</span>
    <strong dir="ltr" style="letter-spacing:.2em;">{{ tg_code }}</strong>
  </div>
  <p style="color:var(--text-muted); font-size:.85rem; margin-top:.5rem;">{{ t('tg_code_hint') }}</p>
  {% endif %}
  {% endif %}
  <form method="post" action="{{ url_for('user.telegram_prefs') }}" style="margin-top:1rem;">
    <input type="hidden" name="csrf" value="{{ session.get('csrf','') }}">
    <label class="chk"><input type="checkbox" name="tg_notif" {% if tg_pref %}checked{% endif %}> {{ t('tg_notif') }}</label>
    <button class="btn btn-ghost btn-sm" type="submit" style="margin-inline-start:.6rem;">{{ t('save') }}</button>
  </form>
</div>
{% endblock %}
