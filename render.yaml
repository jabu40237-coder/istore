services:
  - type: web
    name: istore
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: APP_ENV
        value: production
      - key: PROVIDER_MODE
        value: kd1s
      - key: DATABASE_URL
        fromDatabase:
          name: istore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: KD1S_API_KEY
        sync: false
      - key: USD_TO_IQD
        value: "1500"

databases:
  - name: istore-db
    plan: free
